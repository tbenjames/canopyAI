name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 06:00 UTC: catches packages that turn vulnerable without any push.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit dependencies (fail on critical)
        run: npm run audit:critical

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
