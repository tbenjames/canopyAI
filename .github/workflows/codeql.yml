name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:javascript-typescript"
git clone git@github.com:supprttmrnhinitiative-dev/visual-reef-watch.git
cd visual-reef-watch
git fetch origin
git checkout -b ci/skip-codeql-forked-prs origin/ci/skip-codeql-forked-prs
Replace .github/workflows/codeql.yml with the content above
git add .github/workflows/codeql.yml
git commit -m "ci(codeql): skip analysis for forked pull requests to avoid permission errors"
git push --set-upstream origin ci/skip-codeql-forked-prs
Open a Pull Request on GitHub and merge to main
